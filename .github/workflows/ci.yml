name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The build that ships to Linux and containers: no desktop feature.
  server:
    name: Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # The same binary with the desktop app compiled in. gpui needs a windowing
  # stack to build; macOS runners have one out of the box.
  desktop:
    name: With desktop app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint
        run: cargo clippy --all-targets --features desktop-test --locked -- -D warnings

      - name: Test
        run: cargo test --features desktop-test --locked
