[package]
name = "emailulator"
description = "A development email catcher: SMTP and HTTP in, web UI, API, MCP and a desktop app out."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
# The gpui desktop app behind `emailulator app`. Off by default so that the
# server builds anywhere, statically, with no windowing libraries; the macOS
# release turns it on.
desktop = ["dep:chrono", "dep:futures", "dep:gpui", "dep:unicode-segmentation", "dep:wry"]
# The desktop app plus gpui's headless test window, for `cargo test`.
desktop-test = ["desktop", "gpui/test-support"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
mail-builder = "1"
mail-parser = "0.11"
mime_guess = "2"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Desktop app only.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
futures = { version = "0.3", optional = true }
# runtime_shaders: compile Metal shaders at launch, so building needs no Xcode Metal toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"], optional = true }
unicode-segmentation = { version = "1", optional = true }

# The system webview renders message bodies in the desktop app. wry can only
# attach a child webview to a window it does not own on these two platforms.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
