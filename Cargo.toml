[package]
name = "emailulator"
description = "A development email catcher: SMTP and HTTP in, web UI, API, MCP and a desktop app out."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/webteractive/emailulator"
publish = false

[features]
# The desktop app behind `emailulator app`: the web UI in a window of its own.
# Off by default so that the server builds anywhere, statically, with no
# windowing libraries; the macOS release turns it on.
desktop = ["dep:muda", "dep:objc2", "dep:tao", "dep:wry"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7"
mail-builder = "1"
mail-parser = "0.11"
mime_guess = "2"
minisign-verify = "0.2.5"
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# The desktop app: a tao window holding the system webview, with a muda menu
# bar. On Linux wry and muda need GTK and WebKitGTK, which the server release
# must not link, so the app is built for macOS and Windows only.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", optional = true }
tao = { version = "0.37", optional = true }
wry = { version = "0.57", default-features = false, features = ["os-webview"], optional = true }

# Sets the Dock icon. A bare binary has no app bundle to carry one, so the app
# hands AppKit the image itself. Already in the tree, under wry.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
