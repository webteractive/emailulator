# cargo-about: the third-party notices every release archive carries, as
# THIRD_PARTY_LICENSES.md. scripts/licenses.sh writes it, and CI fails when it
# no longer matches Cargo.lock.
#
# The licenses and targets mirror deny.toml: what deny allows into the build is
# what this has to credit. One file covers every target and feature, so a
# Linux archive also lists the macOS app's crates; crediting extra is harmless.

accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

# Build scripts, proc-macros and test-only crates run while building; none of
# their code ends up in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# emailulator itself is unpublished; its own license ships as LICENSE.
private = { ignore = true }
