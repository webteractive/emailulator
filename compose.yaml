# docker compose up -d
#
# EMAILULATOR_AUTH_TOKEN is required: it is the admin token, for the web UI
# and for managing inboxes. Compose stops with the message below without it.
# `openssl rand -hex 32` makes a good value.
#
# EMAILULATOR_PROVISION is optional: inbox=key pairs, comma-separated, made
# valid at startup, for giving an app its SMTP password through configuration:
#   EMAILULATOR_PROVISION=billing-app=<key>
# The app then sends with username billing-app and that key as its password.

services:
  emailulator:
    build: .
    restart: unless-stopped
    environment:
      EMAILULATOR_AUTH_TOKEN: ${EMAILULATOR_AUTH_TOKEN:?set EMAILULATOR_AUTH_TOKEN to a long random token}
      EMAILULATOR_PROVISION: ${EMAILULATOR_PROVISION:-}
    ports:
      # Published on this host's loopback only. To reach it from elsewhere, put
      # a TLS-terminating reverse proxy in front of 8025, or mount a certificate
      # and set EMAILULATOR_TLS_CERT and EMAILULATOR_TLS_KEY.
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    volumes:
      - emailulator-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  emailulator-data:
