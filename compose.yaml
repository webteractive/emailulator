# docker compose up -d
#
# Both secrets are required; compose stops with the message below if either is
# missing. `openssl rand -hex 32` makes a good value for each.

services:
  emailulator:
    build: .
    restart: unless-stopped
    environment:
      EMAILULATOR_AUTH_TOKEN: ${EMAILULATOR_AUTH_TOKEN:?set EMAILULATOR_AUTH_TOKEN to a long random token}
      EMAILULATOR_SMTP_AUTH: ${EMAILULATOR_SMTP_AUTH:?set EMAILULATOR_SMTP_AUTH to user:password}
    ports:
      # Published on this host's loopback only. To reach it from elsewhere, put
      # a TLS-terminating reverse proxy in front of 8025, or mount a certificate
      # and set EMAILULATOR_TLS_CERT and EMAILULATOR_TLS_KEY.
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    volumes:
      - emailulator-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  emailulator-data:
